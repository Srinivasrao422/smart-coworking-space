[build]
  publish = "static"
  functions = "netlify/functions"

# Cache static assets
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Single-page application route rewrite
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
